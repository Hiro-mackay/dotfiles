# Global tools for every environment (macOS and Linux).
# macOS-only tools live in config.macos.toml, loaded on macOS only through
# auto_env in miserc.toml (~/.config is shared with Linux through the repo).
[tools]
node = "latest"
python = "latest"
uv = "latest"
go = "latest"
pnpm = "latest"
terraform = "latest"
kubectl = "latest"
kind = "latest"
skaffold = "latest"
golangci-lint = "latest"
sqlc = "latest"
buf = "latest"
task = "latest"
lefthook = "latest"
"aqua:golang-migrate/migrate" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
# allow_builds runs only this package's postinstall, which fetches its binary.
"npm:codebase-memory-mcp" = { version = "latest", allow_builds = ["codebase-memory-mcp"] }

[settings]
idiomatic_version_file_enable_tools = ["python"]
