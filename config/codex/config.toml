approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
web_search = "cached"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."warp@codex-warp"]
enabled = true

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/mackay/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.codex-warp]
source_type = "git"
source = "https://github.com/warpdotdev/codex-warp.git"

[tui]
notification_condition = "unfocused"
notifications = [ "agent-turn-complete", "approval-requested" ]
status_line = [ "model-with-reasoning", "context-used", "estimated-thread-cost", "five-hour-limit", "weekly-limit", "approval-mode" ]
terminal_title = [ "spinner", "project", "git-branch" ]
theme = "dark-daltonized"
