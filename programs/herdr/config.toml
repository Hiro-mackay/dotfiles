# @bin@ is the store path of ./bin (default.nix), so a key runs the scripts of the same
# switch as this file, wherever the repository is checked out.
# Ghostty turns ⌘-keys into Alt-keys (programs/ghostty/config), bound here directly:
# a prefix sent in the same write as its key loses the key. The prefix moves to F12,
# out of the way of Ctrl-B in shells and Claude Code.

# herdr saves the onboarding choice into this file, which is read-only here.
onboarding = false

[keys]
prefix = "f12"
switch_tab = "alt+1..9"
next_agent = "alt+j"
previous_agent = "alt+k"
last_pane = "alt+semicolon"
next_workspace = "alt+w"
previous_workspace = "alt+q"
open_notification_target = "alt+o"
toggle_sidebar = "alt+b"
split_vertical = "alt+v"
focus_pane_left = "alt+h"
focus_pane_right = "alt+l"

[[keys.command]]
key = "alt+p"
type = "popup"
command = "@bin@/herdr-claude-pick"
description = "claude sessions"
width = "90%"
height = "70%"

[[keys.command]]
key = "alt+r"
type = "popup"
command = "@bin@/herdr-rename"
description = "rename the tab and its Claude session"
width = "70%"
height = 5

[[keys.command]]
key = "alt+x"
type = "shell"
command = "@bin@/herdr-close"
description = "close pane, or put a Claude session to sleep"

[[keys.command]]
key = "shift+enter"
type = "shell"
command = "@bin@/herdr-shift-enter"
description = "newline in Claude"

[[keys.command]]
key = "alt+t"
type = "shell"
command = "@bin@/herdr-new-shell"
description = "new shell"

[[keys.command]]
key = "alt+s"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch shell"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+y"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" && lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[ui]
accent = "#7fb2d6"
prompt_new_tab_name = false
confirm_close = false
# What needs you first, as ⌘P groups them; ⌘⇧↓ walks the same order.
agent_panel_sort = "priority"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

# Claude titles its terminal after the conversation; $dir comes from herdr-new-claude.
[ui.sidebar.agents]
rows = [["state_icon", "terminal_title_stripped"], ["$dir"]]

# The gray ramp and muted hues of programs/ghostty/config: panels take the terminal's
# own background, surfaces step up in lightness, and hue marks only focus and state.
[theme.custom]
panel_bg = "reset"
sidebar_bg = "#171a1c"
surface_dim = "#171a1c"
surface0 = "#202326"
surface1 = "#2e3134"
active_row_bg = "#202326"
selection_bg = "#202326"
overlay0 = "#d6d8db"
overlay1 = "#d6d8db"
text = "#e5e8ec"
subtext0 = "#d6d8db"
accent = "#7fb2d6"
mauve = "#7fb2d6"
blue = "#7aa3c8"
teal = "#67acb0"
green = "#89b992"
yellow = "#c1a874"
red = "#d69993"
peach = "#e2afaa"
