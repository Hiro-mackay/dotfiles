# Declared Codex settings. Every switch merges them into ~/.codex/config.toml, which stays
# writable and untracked: keys Codex writes there (trust, machine paths) are kept, and
# the keys below win. The sandbox, plugin marketplaces and guardrails are added in
# default.nix.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
# Short answers, no reasoning summaries or reasoning events in the TUI.
model_verbosity = "low"
model_reasoning_summary = "none"
hide_agent_reasoning = true
web_search = "cached"

[plugins."ponytail@ponytail"]
enabled = true

[plugins."warp@codex-warp"]
enabled = true

# Resolved through PATH (mise shims).
[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"

[tui]
# Notifications come from the Warp plugin (warp@codex-warp), not the TUI.
notifications = false
status_line = [ "model-with-reasoning", "context-used", "estimated-thread-cost", "five-hour-limit", "weekly-limit", "approval-mode" ]
terminal_title = [ "spinner", "project", "git-branch" ]
theme = "dark-daltonized"
