name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**/README.md", "README.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/README.md", "README.md", "docs/**"]
  workflow_dispatch:
  # Called by update-flake-lock.yml to check its branch before it reaches main.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request replaces the run still going for the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Evaluates every configuration and checks formatting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
      - run: nix flake check --all-systems --no-build --impure
      - run: nix fmt -- --ci

  darwin:
    # The macOS configuration, without a Mac. check evaluates it; this asks the binary
    # caches what building it would take. Everything must be downloadable except the
    # configuration's own small files (written by a single build command) and a few
    # helper scripts nix-darwin, home-manager and nix-homebrew make from local
    # sources. Anything else would be compiled from source on the Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Check that the darwin configuration comes from binary caches
        run: |
          nix build --impure --dry-run .#darwinConfigurations.default.system 2>"$RUNNER_TEMP/dry"
          grep -E '^  /nix/store/.*\.drv$' "$RUNNER_TEMP/dry" | xargs -r nix derivation show >"$RUNNER_TEMP/drv.json"
          # Built with configure/build/install phases and not a download: a package.
          compiled=$(jq -r '.derivations[]
            | select((.outputs | map(has("hash") or has("method")) | any | not)
              and ((.env.buildCommand // .structuredAttrs.buildCommand) == null))
            | .name' "$RUNNER_TEMP/drv.json" |
            grep -vxE 'brew|builder\.pl|check-link-targets\.sh|darwin-(option|rebuild|version)|nuke-homebrew-repository' || true)
          if [ -n "$compiled" ]; then
            echo "::error::Not in a binary cache, so a Mac would compile: $(printf '%s' "$compiled" | tr '\n' ' ')"
            exit 1
          fi

  linux-e2e:
    # Fresh Ubuntu, normal user, real install.sh: proves the environment can be
    # rebuilt from scratch. Not a container: the Nix daemon needs systemd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # gopls is compiled from Go sources (~40 s); that it compiles is upstream's
          # concern, not this repo's. The other tools still install.
          MISE_DISABLE_TOOLS: go:golang.org/x/tools/gopls
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          # An empty ~/.gitconfig, as some tool left on a Mac; the switch removes it.
          : >"$HOME/.gitconfig"
          sh install.sh
      - name: Verify the environment
        run: |
          set -eux
          # Steps run in a non-login shell: load the Nix profile into PATH.
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          # Managed by home-manager (read-only store links).
          test -L "$HOME/.config/zsh/.zshrc"
          test -L "$HOME/.claude/settings.json"
          test -f "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.claude/skills/plan-template/SKILL.md"
          test -f "$HOME/.codex/AGENTS.md"
          test -f "$HOME/.codex/skills/plan-template/SKILL.md"
          # Declared Codex settings merged into the user's writable config.
          test ! -L "$HOME/.codex/config.toml"
          grep -q codebase-memory-mcp "$HOME/.codex/config.toml"
          # MCP servers are registered by the mise shim's absolute path.
          test -x "$HOME/.local/share/mise/shims/codebase-memory-mcp"
          # bash as the login shell gets the same PATH and variables.
          bash -lc 'command -v claude codex mise && test -n "$DOTFILES_DIR"'
          # This repo runs its pre-commit hook (matched by remote URL), which takes only
          # GitHub noreply addresses.
          test "$(git -C "$HOME/.dotfiles" config core.hooksPath)" = programs/git/hooks
          # gh owns its config.yml (it writes it on login); the switch sets values in it.
          test -f "$HOME/.config/gh/config.yml" && test ! -L "$HOME/.config/gh/config.yml"
          test "$(gh config get git_protocol)" = https
          # The switch created a writable accounts file; the base account comes from Nix.
          test -f "$HOME/.gitconfig.accounts" && test ! -L "$HOME/.gitconfig.accounts"
          (cd / && git config user.email) | grep -q 'users.noreply.github.com$'
          test ! -e "$HOME/.gitconfig"
          if git -C "$HOME/.dotfiles" -c user.name=t -c user.email=t@example.com commit -q --allow-empty -m t; then exit 1; fi
          git -C "$HOME/.dotfiles" -c user.name=t -c user.email=t@users.noreply.github.com commit -q --allow-empty -m t
          # Both agents get the guardrails from programs/agents/guardrails.nix.
          jq -e '.permissions.deny | index("Bash(sudo:*)") and index("Read(~/.ssh/**)")' "$HOME/.claude/settings.json"
          codex execpolicy check --rules "$HOME/.codex/rules/guardrails.rules" sudo true | jq -e '.decision == "forbidden"'
          # The status line must render reset times with GNU date, without errors.
          sl="$(jq -r .statusLine.command "$HOME/.claude/settings.json")"
          echo '{"rate_limits":{"five_hour":{"used_percentage":10,"resets_at":1800000000}}}' | "$sl" 2>"$RUNNER_TEMP/sl.err" | grep -q '[0-9][0-9]/[0-9][0-9] '
          test ! -s "$RUNNER_TEMP/sl.err"
          zsh -ic '
            set -e
            for c in gwi gws z g mkcd cheat lg ubuntu dexec; do whence -w $c; done
            for c in op jc sbxc ccgo c2; do if whence $c >/dev/null; then exit 1; fi; done
            command -v claude codex mise comma git-secrets
            codebase-memory-mcp --version
            [[ "export AWS_SECRET_ACCESS_KEY=x" == ${~HISTORY_IGNORE} ]]
            [[ "ls -la" != ${~HISTORY_IGNORE} ]]
          '
          # Accounts: gh-setup, git's credentials and the gh wrapper, against a fake GitHub.
          sh "$HOME/.dotfiles/programs/gh/test.sh"
          # Conversations and memory reach the vault: the capture hook's own self-test.
          "$(jq -r '.hooks.SessionEnd[0].hooks[0].command' "$HOME/.claude/settings.json" | cut -d' ' -f1)" self-test
          # The repo stays untouched: nothing is generated or linked into it.
          test -z "$(git -C "$HOME/.dotfiles" status --porcelain)"
