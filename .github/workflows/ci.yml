name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Evaluates every configuration (module assertions included) and checks formatting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check --all-systems --no-build
      - run: nix fmt -- --ci

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Build both darwin configurations as the runner user
        run: |
          nix build --impure --no-link --print-out-paths \
            .#darwinConfigurations.default.system \
            .#darwinConfigurations.minimal.system

  linux-e2e:
    # Fresh Ubuntu, normal user, real install.sh: proves the environment can be
    # rebuilt from scratch. Not a container: the Nix daemon needs systemd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          sh install.sh
      - name: Verify links, tools and shell
        run: |
          set -eux
          # Steps run in a non-login shell: load the Nix profile into PATH.
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          test "$(readlink "$HOME/.config")" = "$HOME/.dotfiles/config"
          test "$(readlink "$HOME/.zshenv")" = "$HOME/.dotfiles/config/zsh/.zshenv"
          test "$(readlink "$HOME/.claude")" = "$HOME/.config/claude"
          test "$(readlink "$HOME/.codex")" = "$HOME/.config/codex"
          test -L "$HOME/.dotfiles/config/claude/skills/plan-template"
          test -f /etc/codex/config.toml
          test -f /etc/claude-code/managed-settings.d/10-nix.json
          zsh -ic '
            set -e
            for c in gwi gws z g mkcd cheat lg ubuntu dexec; do whence -w $c; done
            for c in op jc sbxc ccgo c2; do ! whence $c >/dev/null; done
            command -v codex mise nh comma git-secrets
            mise ls --global --current
            codebase-memory-mcp --version
          '
          "$HOME/.local/bin/claude" --version
          # Activation must not leave tracked changes in the repo.
          git -C "$HOME/.dotfiles" diff
          test -z "$(git -C "$HOME/.dotfiles" status --porcelain --untracked-files=no)"
